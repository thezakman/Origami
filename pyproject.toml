[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "origami-scanner"
dynamic = ["version"]
description = "Adaptive content discovery engine that folds its strategy around the target's behavior, technology and response patterns."
readme = "origami.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "TheZakMan", email = "thezakman@ctf-br.org" }]
keywords = [
    "security", "pentest", "bug-bounty", "content-discovery", "recon",
    "web-security", "fuzzing", "directory-bruteforce", "fingerprinting", "waf",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6",
    "rich>=13",
    "mmh3>=4",
]

[project.optional-dependencies]
http2 = ["h2>=4"]                 # enables --http2 (HTTP/2 via ALPN)
dev = [                           # `pip install -e ".[dev]"` — full contributor setup
    "pytest>=8",
    "ruff>=0.16",
    "mypy>=1.15",
]

[project.urls]
Homepage = "https://github.com/thezakman/Origami"
Repository = "https://github.com/thezakman/Origami"
Issues = "https://github.com/thezakman/Origami/issues"
Changelog = "https://github.com/thezakman/Origami/blob/main/CHANGELOG.md"

[project.scripts]
origami = "origami.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100                 # advisory; E501 is not enforced (see lint.ignore)

[tool.ruff.lint]
# A curated ruleset that catches real bugs and staleness without fighting the
# codebase's deliberate style. Notably we do NOT enable BLE001/S110/S112 — the
# `except Exception: pass` best-effort blocks (wayback._safe, originip, the
# per-shard KB fetch) are intentional, not smells.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",   # line length — long rich-UI strings and comments are intentional
    "E402",   # module import not at top — several files lazy/conditionally import
    "E701",   # multiple statements on one line (colon) — compact style
    "E702",   # multiple statements on one line (semicolon) — compact style
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true     # optional deps (mmh3, h2) and untyped libs don't gate

[tool.setuptools.dynamic]
version = {attr = "origami.__version__"}   # single source of truth (origami/__init__.py)

[tool.setuptools.packages.find]
include = ["origami*"]

[tool.setuptools.package-data]
origami = ["wordlists/*.txt", "wordlists/overlays/*.txt", "brain/*.yaml", "py.typed"]
